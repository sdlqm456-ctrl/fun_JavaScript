<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <body>
      <script
        type="text/javascript"
        src="https://www.gstatic.com/charts/loader.js"
      ></script>
      <script type="text/javascript">
        google.charts.load("current", { packages: ["corechart"] });
        // setOnLoadCallback(drawChart): 라이브러리가 다 로딩되면 drawChart() 실행
        google.charts.setOnLoadCallback(drawChart);
        // 차트에 사용할 배열
        // dataAry: 차트용 데이터배열
        const dataAry = [];
        dataAry.push(["User", "Purchasing Amount"]);

        // fetch 함수를 사용해 데이터 값 가져오기 (비동기처리) => 배열인 경우 사용
        // forEach: 값이 여러개일때 값을 하나하나 가져오는 반복문 (값이 하나인 경우엔 배열이름.push를 써도 무관)
        // push: 배열에 값을 뒤에 추가
        fetch("http://localhost:3000/purchasing")
          .then((resp) => resp.json())
          .then((data) => {
            data.forEach((elem) => {
              // 배열이라서 forEach사용해서 하나씩 꺼냄
              dataAry.push([elem.user, elem.amount]);
            });
            // 차트호출 (drawChart를 나중에 호출)
            google.charts.setOnLoadCallback(drawChart);
          })
          .catch((err) => console.log(err));

        function drawChart() {
          // 배열 => 차트 데이터 반환
          var data = google.visualization.arrayToDataTable(dataAry);
          console.log(data);
          var options = {
            title: "회원별 구매금액",
          };

          var chart = new google.visualization.PieChart(
            document.getElementById("piechart"),
          );

          chart.draw(data, options);
        }
      </script>
    </body>
    <body>
      <div id="piechart" style="width: 900px; height: 500px"></div>
    </body>
  </head>
</html>
